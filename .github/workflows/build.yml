name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: kangaroo-windows-x64-amd-nvidia.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: kangaroo-linux-x64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: kangaroo-macos-x64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install Vulkan (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -y && sudo apt-get install -y libvulkan-dev libvulkan1

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"

      - name: Copy binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\kangaroo.exe" "${{ matrix.artifact }}"

      - name: Copy binary (Unix)
        if: matrix.os != 'windows-latest'
        run: cp target/${{ matrix.target }}/release/kangaroo ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 30

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Delete old latest release
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old latest tag
        run: git push origin :refs/tags/latest || true

      - name: Publish release
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "AMD / NVIDIA / Intel GPU supported. Requires Windows 10/11 64-bit." \
            --prerelease \
            dist/kangaroo-windows-x64-amd-nvidia.exe/kangaroo-windows-x64-amd-nvidia.exe \
            dist/kangaroo-linux-x64/kangaroo-linux-x64 \
            dist/kangaroo-macos-x64/kangaroo-macos-x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
